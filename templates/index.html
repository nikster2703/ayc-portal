<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYC Portal — Sign In</title>
  <link rel="stylesheet" href="/static/css/shared.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(140deg, #111e36 0%, #1e4080 60%, #0a6e8a 100%);
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 22px;
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 28px 72px rgba(0,0,0,.35);
    }
    .club-badge { text-align: center; margin-bottom: 36px; }
    .club-icon {
      width: 68px; height: 68px;
      background: var(--navy);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(27,45,79,.3);
    }
    .club-badge h1 { font-size: 22px; font-weight: 900; color: var(--navy); line-height: 1.25; }
    .club-badge p  { font-size: 14px; color: var(--muted); margin-top: 5px; }
    .club-badge .version { margin-top: 10px; font-size: 12px; color: var(--border); font-weight: 700; letter-spacing: .05em; }

    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 7px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color .18s;
    }
    .form-group input:focus { border-color: var(--teal); }

    .login-btn {
      width: 100%;
      margin-top: 6px;
      padding: 14px;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 11px;
      font-family: 'Nunito', sans-serif;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: .02em;
      transition: background .18s, transform .1s;
    }
    .login-btn:hover  { background: var(--navy-dark); }
    .login-btn:active { transform: scale(.98); }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }

    .error-msg {
      display: none;
      margin-top: 14px;
      background: var(--red-bg);
      border: 1.5px solid #fca5a5;
      color: var(--red);
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 13.5px;
      font-weight: 700;
      text-align: center;
    }
    .error-msg.show { display: block; }

    @media (max-width: 480px) {
      .login-card { padding: 36px 24px 28px; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="club-badge">
      <div class="club-icon">🏅</div>
      <h1>Ashford Youth Club<br>Member Portal</h1>
      <p>Sign in to continue</p>
      <p class="version">{{ app_version }}</p>
    </div>

    <div class="form-group">
      <label>Username</label>
      <input id="inp-user" type="text" placeholder="Enter your username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="inp-pass" type="password" placeholder="Enter your password" autocomplete="current-password">
    </div>

    <button class="login-btn" id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="error-msg" id="login-error">Incorrect username or password — please try again.</div>
  </div>

  <script>
    async function doLogin() {
      const username = document.getElementById('inp-user').value.trim();
      const password = document.getElementById('inp-pass').value;
      const btn      = document.getElementById('login-btn');
      const err      = document.getElementById('login-error');

      if (!username || !password) {
        err.textContent = 'Please enter both username and password.';
        err.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      err.classList.remove('show');

      try {
        const res  = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = data.redirect || '/members';
        } else {
          err.textContent = data.error || 'Login failed — please try again.';
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch (e) {
        err.textContent = 'Could not reach the server — please try again.';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    ['inp-user', 'inp-pass'].forEach(id =>
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') doLogin();
      })
    );
  </script>
</body>
</html>
