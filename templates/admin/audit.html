{% extends "base.html" %}
{% block title %}{{ club_short_name }} Portal — Audit Log{% endblock %}

{% block content %}
<div class="page-header">
  <h1>🔍 Audit Log</h1>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <input type="date" id="f-date-from" class="form-input" style="font-size:13px;width:140px"
           title="From date" onchange="loadLog()">
    <input type="date" id="f-date-to" class="form-input" style="font-size:13px;width:140px"
           title="To date" onchange="loadLog()">
    <select class="session-select" id="user-filter" onchange="loadLog()">
      <option value="">All users</option>
    </select>
    <select class="session-select" id="action-filter" onchange="loadLog()">
      <option value="all">All actions</option>
      <optgroup label="Auth">
        <option value="login">Logins</option>
        <option value="logout">Logouts</option>
        <option value="login_failed">Failed logins</option>
        <option value="change_password">Password changes</option>
      </optgroup>
      <optgroup label="Members">
        <option value="view_member">Member viewed</option>
        <option value="edit_member">Member edited</option>
        <option value="soft_delete_member">Marked as leaver</option>
        <option value="permanent_delete_member">Permanently deleted</option>
        <option value="reinstate_member">Reinstated</option>
        <option value="raise_flag">Alert flag raised</option>
        <option value="dismiss_flag">Flag dismissed</option>
        <option value="auto_resolve_flags">Flags auto-resolved</option>
        <option value="run_alert_rules">Alert checks run</option>
        <option value="create_alert_rule">Alert rule created</option>
        <option value="update_alert_rule">Alert rule updated</option>
        <option value="deactivate_alert_rule">Alert rule deactivated</option>
        <option value="delete_alert_rule">Alert rule deleted</option>
        <option value="add_member_tag">Tag added</option>
        <option value="remove_member_tag">Tag removed</option>
      </optgroup>
      <optgroup label="Registrations">
        <option value="approve_registration">Approved</option>
        <option value="reject_registration">Rejected</option>
      </optgroup>
      <optgroup label="Users">
        <option value="create_user">User created</option>
        <option value="update_user">User updated</option>
        <option value="delete_user">User deleted</option>
      </optgroup>
      <optgroup label="Register">
        <option value="register_complete">Register completed</option>
        <option value="register_reset">Register reset</option>
      </optgroup>
      <optgroup label="Calendar">
        <option value="add_term_session">Session added</option>
        <option value="bulk_term_sessions">Bulk generated</option>
        <option value="update_term_session">Session updated</option>
        <option value="delete_term_session">Session deleted</option>
      </optgroup>
      <optgroup label="Documents">
        <option value="upload_document">Uploaded</option>
        <option value="view_document">Viewed</option>
        <option value="download_document">Downloaded</option>
        <option value="delete_document">Deleted</option>
      </optgroup>
      <optgroup label="Email &amp; Mailshots">
        <option value="create_email_template">Template created</option>
        <option value="edit_email_template">Template edited</option>
        <option value="delete_email_template">Template deleted</option>
        <option value="send_mailshot">Mailshot sent</option>
      </optgroup>
      <optgroup label="Documents">
        <option value="update_document">Updated</option>
        <option value="update_doc_metadata">Metadata saved</option>
        <option value="delete_doc_field">Field permanently deleted</option>
        <option value="deactivate_doc_field">Field deactivated</option>
      </optgroup>
      <optgroup label="Admin">
        <option value="update_settings">Settings updated</option>
        <option value="create_role">Role created</option>
        <option value="update_role">Role updated</option>
        <option value="delete_role">Role deleted</option>
        <option value="maintenance_clear">Maintenance clear</option>
        <option value="maintenance_clear_members">All members cleared</option>
      </optgroup>
    </select>
    <div class="count-pill" id="entry-count" style="cursor:default">—</div>
    <button class="btn btn-ghost btn-sm" onclick="downloadCSV()" title="Download as CSV">⬇️ CSV</button>
  </div>
</div>

<div id="audit-container">
  <div class="loading-state"><div class="spinner"></div><p>Loading audit log…</p></div>
</div>
{% endblock %}

{% block scripts %}
<script>
  let allEntries  = [];
  let _usersLoaded = false;

  const ACTION_LABELS = {
    // Auth
    login:                   { icon: '🔑', label: 'Login',                   colour: 'var(--accent)'   },
    logout:                  { icon: '🚪', label: 'Logout',                  colour: 'var(--muted)'  },
    login_failed:            { icon: '🚫', label: 'Failed login',            colour: 'var(--red)'    },
    change_password:         { icon: '🔒', label: 'Password changed',        colour: 'var(--muted)'  },
    // Members
    view_member:             { icon: '👁',  label: 'Member viewed',           colour: 'var(--muted)'  },
    edit_member:             { icon: '✏️',  label: 'Member edited',           colour: 'var(--navy)'   },
    soft_delete_member:      { icon: '👤', label: 'Marked as leaver',        colour: 'var(--orange)' },
    permanent_delete_member: { icon: '🗑️', label: 'Permanently deleted',     colour: 'var(--red)'    },
    raise_flag:              { icon: '🚨', label: 'Alert flag raised',        colour: '#b45309'       },
    dismiss_flag:            { icon: '✅', label: 'Flag dismissed',           colour: '#166534'       },
    auto_resolve_flags:      { icon: '✅', label: 'Flags auto-resolved',      colour: '#166534'       },
    run_alert_rules:         { icon: '🔍', label: 'Alert checks run',         colour: '#1e40af'       },
    create_alert_rule:       { icon: '🚨', label: 'Alert rule created',       colour: '#1e40af'       },
    update_alert_rule:       { icon: '✏️', label: 'Alert rule updated',       colour: '#1e40af'       },
    deactivate_alert_rule:   { icon: '🗑️', label: 'Alert rule deactivated',   colour: '#b45309'       },
    delete_alert_rule:       { icon: '🗑️', label: 'Alert rule deleted',        colour: 'var(--red)'    },
    reinstate_member:        { icon: '✅', label: 'Member reinstated',       colour: 'var(--green)'  },
    add_member_tag:          { icon: '🏷️', label: 'Tag added',               colour: 'var(--accent)'   },
    remove_member_tag:       { icon: '🏷️', label: 'Tag removed',             colour: 'var(--orange)' },
    // Registrations
    approve_registration:    { icon: '✅', label: 'Registration approved',   colour: 'var(--green)'  },
    reject_registration:     { icon: '❌', label: 'Registration rejected',   colour: 'var(--red)'    },
    // Users
    create_user:             { icon: '🧑', label: 'User created',            colour: 'var(--green)'  },
    update_user:             { icon: '✏️', label: 'User updated',            colour: 'var(--navy)'   },
    delete_user:             { icon: '🗑️', label: 'User deleted',            colour: 'var(--red)'    },
    // Register / Attendance
    register_complete:       { icon: '✔️', label: 'Register completed',      colour: 'var(--green)'  },
    register_reset:          { icon: '↩️', label: 'Register reset',          colour: 'var(--orange)' },
    // Calendar
    add_term_session:        { icon: '📅', label: 'Calendar session added',  colour: 'var(--accent)'   },
    bulk_term_sessions:      { icon: '📅', label: 'Term sessions generated', colour: 'var(--accent)'   },
    update_term_session:     { icon: '📅', label: 'Calendar session updated',colour: 'var(--navy)'   },
    delete_term_session:     { icon: '📅', label: 'Calendar session deleted',colour: 'var(--red)'    },
    // Documents
    upload_document:         { icon: '📁', label: 'Document uploaded',       colour: 'var(--accent)'   },
    view_document:           { icon: '👁', label: 'Document viewed',         colour: 'var(--muted)'  },
    download_document:       { icon: '⬇️', label: 'Document downloaded',     colour: 'var(--muted)'  },
    delete_document:         { icon: '🗑️', label: 'Document removed',        colour: 'var(--orange)' },
    // Email & Mailshots
    create_email_template:   { icon: '✉️',  label: 'Template created',        colour: 'var(--accent)'   },
    edit_email_template:     { icon: '✏️',  label: 'Template edited',         colour: 'var(--navy)'   },
    delete_email_template:   { icon: '🗑️',  label: 'Template deleted',        colour: 'var(--red)'    },
    send_mailshot:           { icon: '📤', label: 'Mailshot sent',            colour: 'var(--accent)'   },
    // Admin / Settings
    update_settings:         { icon: '⚙️', label: 'Settings updated',        colour: 'var(--muted)'  },
    create_role:             { icon: '🛡️', label: 'Role created',            colour: 'var(--accent)'   },
    update_role:             { icon: '🛡️', label: 'Role updated',            colour: 'var(--navy)'   },
    delete_role:             { icon: '🛡️', label: 'Role deleted',            colour: 'var(--red)'    },
    create_tag:              { icon: '🏷️', label: 'Tag definition created',  colour: 'var(--accent)'   },
    update_tag:              { icon: '🏷️', label: 'Tag definition updated',  colour: 'var(--navy)'   },
    maintenance_clear:         { icon: '🧹', label: 'Maintenance clear',          colour: 'var(--orange)' },
    maintenance_clear_members: { icon: '☠️',  label: 'All members cleared',       colour: 'var(--red)'    },
    update_document:           { icon: '📝', label: 'Document updated',           colour: 'var(--navy)'   },
    update_doc_metadata:       { icon: '🏷️', label: 'Document metadata saved',    colour: 'var(--navy)'   },
    delete_doc_field:          { icon: '🗑️', label: 'Doc field permanently deleted', colour: 'var(--red)' },
    deactivate_doc_field:      { icon: '⏸️', label: 'Doc field deactivated',      colour: 'var(--orange)' },
    create_session_note:     { icon: '📝', label: 'Session note added',      colour: 'var(--accent)'   },
    delete_session_note:     { icon: '📝', label: 'Session note deleted',    colour: 'var(--orange)' },
    default:                 { icon: '📋', label: 'Action',                  colour: 'var(--muted)'  },
  };

  function _buildParams() {
    const p = new URLSearchParams({ limit: 1000 });
    const action    = document.getElementById('action-filter').value;
    const userId    = document.getElementById('user-filter').value;
    const dateFrom  = document.getElementById('f-date-from').value;
    const dateTo    = document.getElementById('f-date-to').value;
    if (action && action !== 'all') p.set('action',    action);
    if (userId)                     p.set('user_id',   userId);
    if (dateFrom)                   p.set('date_from', dateFrom);
    if (dateTo)                     p.set('date_to',   dateTo);
    return p;
  }

  async function loadLog() {
    document.getElementById('audit-container').innerHTML =
      '<div class="loading-state"><div class="spinner"></div><p>Loading…</p></div>';
    try {
      // Populate user dropdown on first load
      if (!_usersLoaded) {
        _usersLoaded = true;
        apiFetch('/api/admin/audit/users').then(users => {
          const sel = document.getElementById('user-filter');
          users.forEach(u => {
            const opt = document.createElement('option');
            opt.value = u.id;
            opt.textContent = u.username;
            sel.appendChild(opt);
          });
        }).catch(() => {});
      }

      allEntries = await apiFetch(`/api/admin/audit?${_buildParams()}`);
      document.getElementById('entry-count').textContent =
        `${allEntries.length.toLocaleString()} entries`;
      renderLog(allEntries);
    } catch (e) {
      document.getElementById('audit-container').innerHTML = `
        <div class="alert-box err"><strong>⚠️ Could not load audit log</strong> — ${esc(e.message)}</div>`;
    }
  }

  loadLog();

  function downloadCSV() {
    const p = _buildParams();
    window.location.href = `/api/admin/audit/export.csv?${p}`;
  }

  function renderLog(entries) {
    const container = document.getElementById('audit-container');
    if (!entries.length) {
      container.innerHTML = `<div class="empty-state">No audit entries found.</div>`;
      return;
    }

    const rows = entries.map(e => {
      const info    = ACTION_LABELS[e.action] || ACTION_LABELS.default;
      const details = parseDetails(e.details);
      const ts      = e.timestamp
        ? new Date(e.timestamp + 'Z').toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' })
        : '—';

      return `
        <tr>
          <td style="white-space:nowrap;color:var(--muted);font-size:13px">${esc(ts)}</td>
          <td><strong>${esc(e.username || 'system')}</strong></td>
          <td>
            <span style="color:${info.colour};font-weight:800">${info.icon} ${info.label}</span>
          </td>
          <td style="font-size:13px;color:var(--muted)">${esc(e.ip_address || '—')}</td>
          <td style="font-size:12.5px;color:var(--muted);max-width:320px;word-break:break-word">${details}</td>
        </tr>`;
    }).join('');

    container.innerHTML = `
      <table class="data-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>User</th>
            <th>Action</th>
            <th>IP</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function parseDetails(raw) {
    if (!raw) return '—';
    try {
      const d = JSON.parse(raw);
      const parts = [];

      // Primary entity names
      if (d.member)   parts.push(`<strong>${esc(d.member)}</strong>`);
      if (d.name)     parts.push(`<strong>${esc(d.name)}</strong>`);
      if (d.username) parts.push(`user: <strong>${esc(d.username)}</strong>`);

      // Registration extras
      if (d.new_member_id)                   parts.push(`→ ID: <strong>${esc(d.new_member_id)}</strong>`);
      if (d.type)                            parts.push(`type: ${esc(d.type)}`);
      if (d.session && !d.session_type)      parts.push(`session: ${esc(d.session)}`);
      if (d.role)                            parts.push(`role: <strong>${esc(d.role)}</strong>`);

      // Session / calendar context
      if (d.session_type) parts.push(`<em>${esc(d.session_type)}</em>`);
      if (d.session_date) parts.push(esc(d.session_date));
      if (d.date)         parts.push(esc(d.date));
      if (d.term)         parts.push(`term: ${esc(d.term)}`);
      if (d.status)       parts.push(`→ <strong>${esc(d.status)}</strong>`);
      if (d.note_type)    parts.push(`type: ${esc(d.note_type)}`);

      // Counts & outcomes
      if (d.auto_signout_count != null)  parts.push(`${d.auto_signout_count} auto sign-outs`);
      if (d.attendance_deleted != null)  parts.push(`${d.attendance_deleted} attendance records cleared`);
      if (d.created != null)             parts.push(`${d.created} created`);
      if (d.skipped != null)             parts.push(`${d.skipped} skipped`);
      if (d.cleared != null)             parts.push(`${d.cleared} records cleared`);
      if (d.att_deleted != null)         parts.push(`${d.att_deleted} attendance records`);
      if (d.dofe_deleted != null)        parts.push(`${d.dofe_deleted} DofE records`);
      if (d.contacts_deleted != null)    parts.push(`${d.contacts_deleted} contacts`);

      // Documents
      if (d.title)    parts.push(esc(d.title));
      if (d.category) parts.push(`category: ${esc(d.category)}`);

      // Mailshots
      if (d.subject)              parts.push(`subject: <em>${esc(d.subject)}</em>`);
      if (d.sent != null)         parts.push(`${d.sent} sent`);
      if (d.errors > 0)           parts.push(`<span style="color:var(--red)">${d.errors} errors</span>`);
      if (d.attachments != null)  parts.push(`${d.attachments} attachment${d.attachments !== 1 ? 's' : ''}`);

      // Tags
      if (d.tag) parts.push(`tag: <strong>${esc(d.tag)}</strong>`);

      // Reason / note
      if (d.reason) parts.push(`reason: <em>${esc(d.reason)}</em>`);
      if (d.note)   parts.push(`note: <em>${esc(d.note)}</em>`);

      // Password reset flag (update_user)
      if (d.password_reset) parts.push(`<span style="color:var(--orange)">password reset by admin</span>`);

      // Field changes — detect before/after format vs simple key→value (settings)
      if (d.changes && typeof d.changes === 'object') {
        const entries = Object.entries(d.changes);
        if (entries.length) {
          const firstVal = entries[0][1];
          const isBeforeAfter = firstVal !== null && typeof firstVal === 'object' && 'from' in firstVal;
          if (isBeforeAfter) {
            parts.push(entries.map(([k, v]) =>
              `${esc(k)}: <span style="color:var(--red)">${esc(String(v.from ?? '—'))}</span>`
              + ` → <span style="color:var(--green)">${esc(String(v.to ?? '—'))}</span>`
            ).join('<br>'));
          } else {
            // Settings-style: show key → new value
            parts.push(entries.map(([k, v]) =>
              `${esc(k)}: <strong>${esc(String(v))}</strong>`
            ).join('<br>'));
          }
        }
      }

      return parts.length ? parts.join('<br>') : esc(JSON.stringify(d)).slice(0, 120);
    } catch {
      return esc(raw).slice(0, 120);
    }
  }
</script>
{% endblock %}
