# ── Build & publish the portal image to GitHub Container Registry ─────────────
#
# After this runs once, anyone (your NAS, a Windows box, a Mac) can install the
# portal with just docker-compose.deploy.yml + install.sh — no source, no build.
#
# It triggers on:
#   • a push to main            → publishes :latest
#   • a version tag like v12.37 → publishes :v12.37 (and updates :latest)
#   • a manual "Run workflow"    → publishes :latest
#
# One-time setup on GitHub: nothing to configure — GITHUB_TOKEN already has
# permission to push packages to your own repo. After the first successful run,
# open the repo's "Packages" section and set the package visibility to Public
# so the NAS can pull without logging in.

name: Publish image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      # QEMU lets the amd64 runner cross-build the linux/arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Multi-arch: linux/amd64 for QNAP Container Station (Intel/AMD) and
      # linux/arm64 for the ARM live host. Docker picks the right one per host.
      #
      # NOTE: the arm64 leg compiles sqlcipher3 under QEMU emulation, so this
      # build is considerably slower than the amd64-only one (expect tens of
      # minutes on the first run; the gha cache makes later runs much faster).
      # If it ever becomes painful and the repo is public, splitting the job
      # across a native `ubuntu-24.04-arm` runner removes the emulation cost.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
