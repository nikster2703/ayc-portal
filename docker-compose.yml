# ── Portal — Docker Compose ───────────────────────────────────────────────────
#
# Single service: portal
#
# The Docker project name is taken from the folder this file lives in.
# Clone the repo into a club-named folder (e.g. ara-portal, burnham-portal)
# and Docker will automatically namespace everything accordingly:
#   container:  portal
#   volume:     <folder-name>_portal-data
#
# Secrets and club identity are read from .env in this folder.
# Copy .env.example → .env and fill in your values before first run.
#
# First-time setup:
#   cp .env.example .env
#   vi .env                        ← fill in SECRET_KEY, DB_ENCRYPTION_KEY, CLUB_NAME etc.
#   docker compose build
#   docker compose run --rm portal python scripts/seed_admin.py
#   docker compose up -d
#
# Deploy an update:
#   docker run --rm -v $(pwd):/repo alpine sh -c "apk add --no-cache git && git -C /repo pull"
#   docker compose build
#   docker compose up -d --force-recreate

services:

  portal:
    build: .
    container_name: portal
    restart: unless-stopped
    ports:
      - "5001:5001"           # Change left number to move the external port (e.g. "5005:5001")
    environment:
      - INSTANCE_DIR=/data
      - PORT=5001
      - FLASK_DEBUG=0
    env_file:
      - .env
    volumes:
      - portal-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/auth/me')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  portal-data:
    driver: local
