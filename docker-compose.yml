# ── AYC Portal — Docker Compose ───────────────────────────────────────────────
#
# Two services:
#   portal-live  — production instance  (port 5001, data in portal-live-data volume)
#   portal-dev   — development instance (port 5002, data in portal-dev-data volume)
#
# Instance data (database, uploaded documents, backups) is stored in named
# Docker volumes so it survives container rebuilds.
#
# Secrets are read from .env (live) and .env.dev (dev) in the project root.
# Copy .env.example → .env and fill in your values before starting.
#
# First-time setup:
#   cp .env.example .env && vi .env
#   docker compose build
#   docker compose run --rm portal-live python scripts/seed_admin.py
#   docker compose up -d
#
# Deploy an update:
#   docker run --rm -v $(pwd):/output alpine sh -c "apk add --no-cache git && git -C /output pull"
#   docker compose build
#   docker compose up -d

services:

  portal-live:
    build: .
    container_name: portal-live
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - INSTANCE_DIR=/data
      - PORT=5001
      - FLASK_DEBUG=0
    env_file:
      - .env
    volumes:
      - portal-live-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/auth/me')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  portal-dev:
    build: .
    container_name: portal-dev
    restart: unless-stopped
    ports:
      - "5002:5001"
    environment:
      - INSTANCE_DIR=/data
      - PORT=5001
      - FLASK_DEBUG=1
    env_file:
      - .env.dev
    volumes:
      - portal-dev-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/auth/me')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  portal-live-data:
    driver: local
  portal-dev-data:
    driver: local
